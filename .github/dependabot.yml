version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/apps/ingestion"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/apps/retrieval"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/apps/evals"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/apps/desktop"
    schedule:
      interval: "weekly"
    ignore:
      # HeroUI v3 is a breaking UI migration (component API changes across
      # the app); done deliberately, not via automated PRs.
      - dependency-name: "@heroui/*"
        update-types: ["version-update:semver-major"]
      # jsdom >=29 ships ESM-only transitive deps (html-encoding-sniffer 6+)
      # that break vitest 4 workers (ERR_REQUIRE_ESM); verified locally on
      # 29.1.1 and 30.0.1. Revisit when vitest supports it.
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
