<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Swiss Legal RAG</title>
    <!-- Prevents a white flash on startup: paint the resolved theme's
         background before the bundle (and useTheme's own effect) ever run.
         Kept tiny and import-free on purpose — this must block first paint. -->
    <style>
      html {
        background-color: #fafafa;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background-color: #141414;
        }
      }
    </style>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("slr.theme");
          var pref =
            stored === "light" || stored === "dark" || stored === "system" ? stored : "system";
          var resolved =
            pref === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : pref;
          document.documentElement.className = "chancery-" + resolved + " " + resolved;
        } catch (e) {
          // localStorage/matchMedia can throw in locked-down contexts — the
          // <style> media query above still covers this case either way.
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
