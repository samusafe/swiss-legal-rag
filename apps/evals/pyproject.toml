[project]
name = "evals"
version = "0.1.0"
description = "Gold-dataset evaluation harness for the Swiss Legal RAG retrieval API"
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1",
    "python-dotenv==1.2.2",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "ruff>=0.16.1", "mypy>=2.3.0"]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["evals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = false
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["mlflow"]
ignore_missing_imports = true
