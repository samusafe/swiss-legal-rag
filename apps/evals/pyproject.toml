[project]
name = "evals"
version = "0.1.0"
description = "Gold-dataset evaluation harness for the Swiss Legal RAG retrieval API"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["evals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
