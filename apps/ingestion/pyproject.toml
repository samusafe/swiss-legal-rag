[project]
name = "ingestion"
version = "0.1.0"
description = "Fedlex corpus ingestion CLI (resolve / fetch / parse / embed)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ingest = "ingestion.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ingestion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real Fedlex endpoint (excluded by default)"]
addopts = "-m 'not live'"
