[project]
name = "ingestion"
version = "0.1.0"
description = "Fedlex corpus ingestion CLI (resolve / fetch / parse / embed)"
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "PyYAML==6.0.3",
    "lxml==6.1.1",
    "psycopg[binary]==3.3.4",
    "pgvector==0.5.0",
    "python-dotenv==1.2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=2.3.0"]

[project.scripts]
ingest = "ingestion.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ingestion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits the real Fedlex endpoint (excluded by default)",
    "corpus: needs the local data/raw corpus cache (auto-skipped when absent)",
    "db: needs the local Postgres from docker compose (auto-skipped when unreachable)",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = false
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["yaml", "lxml.*", "psycopg.*", "pgvector.*"]
ignore_missing_imports = true
