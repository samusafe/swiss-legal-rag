[project]
name = "retrieval"
version = "0.1.0"
description = "Hybrid search + RAG API over Swiss federal law (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.1",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "psycopg[binary]==3.3.4",
    "pgvector==0.5.0",
    "sentence-transformers==5.6.1",
    "python-dotenv==1.2.2",
    "langdetect==1.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "ruff>=0.16.1", "mypy>=2.3.0"]

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["retrieval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs the local Postgres from docker compose (auto-skipped when unreachable)"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = false
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["psycopg.*", "pgvector.*", "sentence_transformers.*", "langdetect.*"]
ignore_missing_imports = true
