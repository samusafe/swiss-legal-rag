[project]
name = "retrieval"
version = "0.1.0"
description = "Hybrid search + RAG API over Swiss federal law (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "sentence-transformers>=3.0",
    "python-dotenv>=1.0",
    "langdetect>=1.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["retrieval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs the local Postgres from docker compose (auto-skipped when unreachable)"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = false
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["psycopg.*", "pgvector.*", "sentence_transformers.*", "langdetect.*"]
ignore_missing_imports = true
