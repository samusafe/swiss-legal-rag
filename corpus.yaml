# Corpus manifest — every act is fetched in each language via the Fedlex
# SPARQL endpoint. Adding an act = one entry here + re-run ingestion.
# SR = Systematic Compilation number (Systematische Rechtssammlung).

languages: [de, fr, it]

acts:
  - sr: "101"
    name: Federal Constitution
    abbrev: BV / Cst.
  - sr: "210"
    name: Civil Code
    abbrev: ZGB / CC
  - sr: "220"
    name: Code of Obligations
    abbrev: OR / CO
  - sr: "235.1"
    name: Federal Act on Data Protection
    abbrev: DSG / LPD
  - sr: "311.0"
    name: Criminal Code
    abbrev: StGB / CP
  - sr: "822.11"
    name: Labour Act
    abbrev: ArG / LTr
  - sr: "830.1"
    name: General Part of Social Insurance Law Act
    abbrev: ATSG / LPGA
  - sr: "837.0"
    name: Unemployment Insurance Act
    abbrev: AVIG / LACI
  - sr: "142.20"
    name: Foreign Nationals and Integration Act
    abbrev: AIG / LEI
  - sr: "741.01"
    name: Road Traffic Act
    abbrev: SVG / LCR
