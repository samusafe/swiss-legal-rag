# Corpus manifest — one block per jurisdiction; adding an act = one entry,
# adding a canton = one block.
# CH acts are fetched in each language via the Fedlex SPARQL endpoint (SR =
# Systematische Rechtssammlung). Cantonal acts are fetched via each canton's
# LexWork JSON API (collection = the canton's own systematic-collection code).

jurisdictions:
  - code: CH
    source: fedlex
    collection: SR
    languages: [de, fr, it]
    acts:
      - number: "101"
        name: Federal Constitution
        abbrev: BV / Cst.
      - number: "210"
        name: Civil Code
        abbrev: ZGB / CC
      - number: "220"
        name: Code of Obligations
        abbrev: OR / CO
      - number: "235.1"
        name: Federal Act on Data Protection
        abbrev: DSG / LPD
      - number: "311.0"
        name: Criminal Code
        abbrev: StGB / CP
      - number: "822.11"
        name: Labour Act
        abbrev: ArG / LTr
      - number: "830.1"
        name: General Part of Social Insurance Law Act
        abbrev: ATSG / LPGA
      - number: "837.0"
        name: Unemployment Insurance Act
        abbrev: AVIG / LACI
      - number: "142.20"
        name: Foreign Nationals and Integration Act
        abbrev: AIG / LEI
      - number: "741.01"
        name: Road Traffic Act
        abbrev: SVG / LCR

  - code: SG
