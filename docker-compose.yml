services:
  db:
    image: pgvector/pgvector:pg16
    container_name: swiss-legal-rag-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-swiss_legal_rag}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-swiss_legal_rag}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
